<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cirugías · San Benito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="demo.css">
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <button type="button" class="icon-hit" id="nav-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Abrir menú">
                <span class="burger" aria-hidden="true"></span>
            </button>
            <span class="topbar-brand">San Benito</span>
            <button type="button" class="icon-hit" id="user-toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Abrir sesión">
                <span class="avatar" aria-hidden="true">SE</span>
            </button>
        </header>

        <div class="frame">
            <aside class="sidebar" id="sidebar" aria-label="Navegación" data-open="false">
                <button type="button" class="brand" id="brand-home">
                    <img src="../../public/images/san-benito-logo.png" width="56" height="56" alt="">
                    <span class="brand-lines">
                        <span class="brand-kicker">Sanatorio integral</span>
                        <span class="brand-name">San Benito</span>
                    </span>
                </button>

                <div class="sidebar-nav" id="sidebar-nav-panel">
                    <nav class="nav" aria-label="Secciones">
                        <div class="nav-group" data-permission="surgeries.catalog.view">
                            <button type="button" class="nav-btn nav-parent is-current" id="nav-surgeries" aria-expanded="true" aria-controls="nav-surgeries-links">
                                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
                                <span class="nav-label">Cirugías</span>
                                <svg class="icon nav-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                            </button>
                            <div class="nav-sub" id="nav-surgeries-links">
                                <button type="button" class="nav-btn nav-child" data-section="pending">
                                    <span class="nav-label">Pendientes</span>
                                    <span class="nav-count" data-count="pending"></span>
                                </button>
                                <button type="button" class="nav-btn nav-child" data-section="approved">
                                    <span class="nav-label">Aprobadas</span>
                                    <span class="nav-count" data-count="approved"></span>
                                </button>
                                <button type="button" class="nav-btn nav-child" data-section="history">
                                    <span class="nav-label">Historial</span>
                                    <span class="nav-count" data-count="history"></span>
                                </button>
                            </div>
                        </div>
                    </nav>
                    <div class="sidebar-foot sidebar-foot-desktop">
                        <strong>Secretaria</strong>
                        <span>Admin</span>
                        <button type="button" class="btn btn-outline btn-sm btn-block" id="logout-desktop">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                            Cerrar sesión
                        </button>
                    </div>
                </div>

                <div class="sidebar-user" id="sidebar-user-panel" hidden>
                    <div class="sidebar-foot">
                        <strong>Secretaria</strong>
                        <span>Admin</span>
                        <button type="button" class="btn btn-outline btn-sm btn-block" id="logout-mobile">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                            Cerrar sesión
                        </button>
                    </div>
                </div>
            </aside>

            <main id="main">
                <section id="view-list" data-view="list">
                    <header class="page-header">
                        <div class="page-header-copy">
                            <h1 id="list-title">Cirugías</h1>
                            <p id="list-subtitle"></p>
                        </div>
                        <div class="header-actions">
                            <button type="button" class="btn btn-outline" id="open-calendar" data-permission="surgeries.catalog.view">
                                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                                Calendario
                            </button>
                            <button type="button" class="btn" id="open-create" data-permission="surgeries.create">
                                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                                Solicitar cirugía
                            </button>
                        </div>
                    </header>
                    <div class="stage">
                        <form class="filter-band" id="filter-form">
                            <label class="field" for="filter-q">
                                <span>Paciente</span>
                                <input id="filter-q" name="q" type="search" autocomplete="off" placeholder="Nombre o DNI">
                            </label>
                            <button type="submit" class="btn">
                                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                                Buscar
                            </button>
                            <button type="button" class="btn btn-outline" id="open-filters">
                                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
                                <span id="open-filters-label">Filtros</span>
                            </button>
                        </form>
                        <div class="list" id="surgery-list"></div>
                        <form class="filter-panel" id="filter-panel" hidden>
                            <div class="filter-panel-grid">
                                <label class="field" for="filter-status" id="filter-status-field">
                                    <span>Estado</span>
                                    <select id="filter-status" name="status">
                                        <option value="">Todos</option>
                                        <option value="to_schedule">A programar</option>
                                        <option value="scheduled">Programada</option>
                                    </select>
                                </label>
                                <label class="field" for="filter-specialty">
                                    <span>Especialidad</span>
                                    <select id="filter-specialty" name="specialty_id"></select>
                                </label>
                                <label class="field" for="filter-doctor">
                                    <span>Doctor</span>
                                    <select id="filter-doctor" name="doctor_id"></select>
                                </label>
                                <label class="field" for="filter-insurance">
                                    <span>Obra social</span>
                                    <select id="filter-insurance" name="health_insurance_id"></select>
                                </label>
                            </div>
                            <div class="filter-panel-actions">
                                <button type="submit" class="btn">Aplicar</button>
                                <button type="button" class="btn btn-outline" id="filter-panel-back">Volver</button>
                            </div>
                        </form>
                    </div>
                </section>

                <section id="view-create" data-view="create" hidden>
                    <header class="page-header">
                        <div class="page-header-copy">
                            <button type="button" class="back-link" id="create-back">
                                <svg class="icon icon-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                                Cirugías
                            </button>
                            <h1 class="sr-only">Cirugías</h1>
                            <p>Solicitar cirugía. Paciente, obra social, doctor y nota. Sin horario.</p>
                        </div>
                    </header>
                    <form class="stage form-grid" id="create-form">
                        <label class="field" for="patient-q">
                            <span>Paciente</span>
                            <input id="patient-q" name="q" type="search" autocomplete="off" placeholder="Nombre, DNI o correo">
                        </label>
                        <p class="hint" id="patient-hint">Mínimo 2 caracteres.</p>
                        <div class="pick-list" id="patient-results"></div>
                        <p class="picked" id="patient-picked" hidden></p>
                        <label class="field" for="health-insurance-id">
                            <span>Obra social</span>
                            <select id="health-insurance-id" name="health_insurance_id"></select>
                        </label>
                        <label class="field" for="doctor-id">
                            <span>Doctor</span>
                            <select id="doctor-id" name="doctor_id"></select>
                        </label>
                        <label class="field" for="note">
                            <span>Nota</span>
                            <textarea id="note" name="note" rows="4" required></textarea>
                        </label>
                        <p class="error" id="create-error" hidden></p>
                        <div class="form-actions">
                            <button type="submit" class="btn" data-permission="surgeries.create">Solicitar cirugía</button>
                        </div>
                    </form>
                </section>

                <section id="view-calendar" data-view="calendar" hidden>
                    <header class="page-header">
                        <div class="page-header-copy">
                            <button type="button" class="back-link" id="calendar-back">
                                <svg class="icon icon-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                                Cirugías
                            </button>
                            <h1 class="sr-only">Cirugías</h1>
                            <p id="calendar-subtitle">Calendario de cirugías programadas.</p>
                        </div>
                    </header>
                    <div class="agenda" id="agenda">
                        <div class="cal" id="calendar-month"></div>
                        <div class="panel" id="day-panel"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <div class="modal" id="detail-modal" hidden>
        <div class="modal-backdrop" id="detail-backdrop"></div>
        <div class="modal-dialog modal-dialog-wide" role="dialog" aria-modal="true" aria-labelledby="detail-title">
            <div class="detail-head">
                <h2 id="detail-title"></h2>
                <span id="detail-status"></span>
            </div>
            <div class="detail-body" id="detail-body"></div>
            <div class="modal-actions" id="detail-actions"></div>
        </div>
    </div>

    <div class="modal" id="modal" hidden>
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-dialog" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="modal-cancel">Volver</button>
                <button type="button" class="btn" id="modal-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="demo.js"></script>
</body>
</html>
