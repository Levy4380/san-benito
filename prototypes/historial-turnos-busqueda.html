<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prototipo — Historial · búsqueda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-paper: oklch(99% 0.006 255);
      --color-paper-2: oklch(96.5% 0.01 255);
      --color-paper-3: oklch(93.5% 0.014 255);
      --color-ink: oklch(22% 0.02 255);
      --color-ink-2: oklch(48% 0.016 255);
      --color-rule: oklch(88% 0.012 255);
      --color-accent: oklch(47% 0.16 255);
      --color-accent-ink: oklch(99% 0.004 255);
      --color-accent-soft: oklch(92% 0.045 255);
      --color-focus: oklch(52% 0.18 255);
      --color-danger: oklch(52% 0.18 25);
      --font-display: "Inter Tight", "Segoe UI", sans-serif;
      --font-body: "IBM Plex Sans", "Segoe UI", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --space-2xs: 0.5rem;
      --space-xs: 0.75rem;
      --space-sm: 1rem;
      --space-md: 1.5rem;
      --space-lg: 2rem;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-md: 1rem;
      --text-xl: 1.5rem;
      --radius-card: 8px;
      --radius-input: 6px;
      --rule-hair: 1px solid var(--color-rule);
      --shadow-sm: 0 1px 2px oklch(22% 0.02 255 / 0.14);
      --control-h: 2.75rem;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-short: 180ms;
      --app-frame: 0.45rem;
      --app-radius: 0.85rem;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-body);
      color: var(--color-ink);
      background: var(--color-paper-2);
      padding: var(--app-frame);
      line-height: 1.45;
    }

    .shell {
      display: grid;
      grid-template-columns: 16.75rem minmax(0, 1fr);
      gap: var(--app-frame);
      height: calc(100dvh - 2 * var(--app-frame));
      min-height: 0;
    }

    .sidebar {
      background: var(--color-paper);
      border-radius: var(--app-radius);
      padding: var(--space-md) var(--space-sm);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      border: var(--rule-hair);
    }

    .brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
      padding: 0 var(--space-2xs);
    }

    .nav-label {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--color-ink-2);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0 0 var(--space-2xs);
      padding: 0 var(--space-2xs);
    }

    .nav-btn {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--color-ink-2);
      border-radius: var(--radius-input);
      padding: 0.55rem 0.65rem;
      font: inherit;
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
    }
    .nav-btn:hover { color: var(--color-ink); background: var(--color-paper-2); }
    .nav-btn.is-active {
      background: var(--color-accent);
      color: var(--color-accent-ink);
    }

    .main {
      background: var(--color-paper);
      border-radius: var(--app-radius);
      border: var(--rule-hair);
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: auto;
      padding: var(--space-md) var(--space-lg) var(--space-lg);
    }

    .page-header { margin-bottom: var(--space-md); flex-shrink: 0; }
    .page-header h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .page-header p {
      margin: 0.35rem 0 0;
      color: var(--color-ink-2);
      font-size: var(--text-sm);
    }

    .stage {
      flex: 1;
      min-height: 0;
      border: var(--rule-hair);
      border-radius: var(--radius-card);
      background: var(--color-paper);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .results {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .step-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--text-md);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .hub-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 12rem;
    }

    .choice-grid {
      display: grid;
      width: 100%;
      max-width: 24rem;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-sm);
    }
    .choice-grid.is-three {
      max-width: 36rem;
      grid-template-columns: repeat(3, 1fr);
    }

    .choice-card {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      border: var(--rule-hair);
      border-radius: var(--radius-card);
      background: var(--color-paper);
      color: var(--color-ink);
      cursor: pointer;
      font: inherit;
      padding: var(--space-sm);
      transition: border-color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
    }
    .choice-card:hover { border-color: var(--color-accent); }
    .choice-card:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }
    .choice-card svg {
      width: 1.75rem;
      height: 1.75rem;
      color: var(--color-accent);
      stroke-width: 1.75;
    }
    .choice-card strong {
      font-family: var(--font-display);
      font-size: var(--text-md);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .criterion-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      min-height: 12rem;
      width: 100%;
      max-width: 22rem;
      margin-inline: auto;
    }

    .back-link {
      align-self: flex-start;
      border: 0;
      background: transparent;
      color: var(--color-ink-2);
      font: inherit;
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    .back-link:hover { color: var(--color-accent); }
    .back-link svg { width: 1.05em; height: 1.05em; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      width: 100%;
      min-width: 0;
    }
    .field label {
      font-size: var(--text-sm);
      font-weight: 500;
    }
    .field input,
    .field select {
      height: var(--control-h);
      border: var(--rule-hair);
      border-radius: var(--radius-input);
      background: var(--color-paper);
      padding: 0 0.75rem;
      font: inherit;
      font-size: var(--text-sm);
      color: var(--color-ink);
      width: 100%;
    }
    .field input:focus,
    .field select:focus {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }
    .field input[readonly] {
      background: var(--color-paper-2);
      color: var(--color-ink);
      cursor: default;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      height: var(--control-h);
      padding: 0 0.85rem;
      border-radius: var(--radius-input);
      border: 1px solid transparent;
      background: var(--color-accent);
      color: var(--color-accent-ink);
      font: inherit;
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: filter var(--dur-short) var(--ease-out);
      white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }
    .btn svg { width: 1.05rem; height: 1.05rem; flex-shrink: 0; }
    .btn-outline {
      background: var(--color-paper);
      color: var(--color-ink);
      border-color: var(--color-rule);
      box-shadow: none;
    }
    .btn-outline:hover {
      background: var(--color-accent);
      color: var(--color-accent-ink);
      border-color: transparent;
      filter: none;
    }
    .btn-danger {
      background: var(--color-danger);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }
    .btn-danger:hover { filter: brightness(1.05); }
    .btn-block { width: 100%; }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: var(--space-sm);
      align-items: end;
    }

    .booking-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-2xs);
      margin-top: var(--space-2xs);
      overflow: auto;
      min-height: 0;
    }
    .booking-card {
      border: var(--rule-hair);
      border-radius: var(--radius-card);
      padding: 0.7rem var(--space-sm);
      background: var(--color-paper);
    }
    .booking-card strong {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .booking-meta {
      margin-top: 0.35rem;
      color: var(--color-ink-2);
      font-size: var(--text-sm);
    }
    .booking-time {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--color-ink);
    }

    .hint {
      margin: 0;
      font-size: var(--text-xs);
      color: var(--color-ink-2);
      text-align: center;
      max-width: 22rem;
    }

    .proto-bar {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      padding: 0.65rem 0.75rem;
      background: var(--color-paper);
      border: var(--rule-hair);
      border-radius: var(--radius-card);
      box-shadow: 0 6px 18px oklch(22% 0.02 255 / 0.14);
      max-width: calc(100vw - 2rem);
    }
    .proto-bar strong {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--color-ink-2);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-right: 0.25rem;
    }
    .seg {
      display: inline-flex;
      border: var(--rule-hair);
      border-radius: var(--radius-input);
      overflow: hidden;
      height: 2.25rem;
    }
    .seg button {
      border: 0;
      background: var(--color-paper);
      color: var(--color-ink-2);
      font: inherit;
      font-size: var(--text-xs);
      font-weight: 500;
      padding: 0 0.75rem;
      cursor: pointer;
    }
    .seg button + button { border-left: var(--rule-hair); }
    .seg button.is-on {
      background: var(--color-accent);
      color: var(--color-accent-ink);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: oklch(22% 0.02 255 / 0.28);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }
    .modal-backdrop.is-open { display: flex; }
    .modal {
      width: min(36rem, 100%);
      background: var(--color-paper);
      border-radius: var(--radius-card);
      border: var(--rule-hair);
      box-shadow: 0 10px 28px oklch(22% 0.02 255 / 0.14);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .modal h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .modal-grid {
      display: grid;
      gap: var(--space-sm);
      grid-template-columns: 1fr 1fr;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    [hidden] { display: none !important; }

    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; height: auto; min-height: calc(100dvh - 2 * var(--app-frame)); }
      .sidebar { display: none; }
      .main { padding: var(--space-sm); }
      .toolbar { grid-template-columns: 1fr; }
      .choice-grid.is-three { grid-template-columns: 1fr 1fr; max-width: 24rem; }
      .choice-grid.is-three .choice-card:last-child {
        grid-column: 1 / -1;
        max-width: calc(50% - 0.5rem);
        justify-self: center;
      }
      .modal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-hidden="true">
      <div class="brand">San Benito</div>
      <div>
        <p class="nav-label">Navegación</p>
        <button type="button" class="nav-btn">Cirugías</button>
        <button type="button" class="nav-btn">Profesionales</button>
        <button type="button" class="nav-btn">Pacientes</button>
        <button type="button" class="nav-btn is-active">Historial</button>
      </div>
    </aside>

    <main class="main">
      <header class="page-header">
        <h1 id="page-title">Historial de turnos</h1>
        <p id="page-desc">Turnos cuyo horario de inicio ya pasó.</p>
      </header>

      <section class="stage" aria-live="polite">
        <!-- VISTA 1: hub -->
        <div class="results" id="view-hub">
          <h2 class="step-title">Buscar por:</h2>
          <div class="hub-wrap">
            <div class="choice-grid" id="choice-grid" role="list">
              <button type="button" class="choice-card" data-criterion="date" role="listitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                  <path d="M16 2v4M8 2v4M3 10h18" />
                </svg>
                <strong>Fecha</strong>
              </button>
              <button type="button" class="choice-card" data-criterion="professional" data-admin-only role="listitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                <strong>Doctor</strong>
              </button>
              <button type="button" class="choice-card" data-criterion="patient" role="listitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <strong>Paciente</strong>
              </button>
              <button type="button" class="choice-card" data-criterion="specialty" data-appointments-only role="listitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M11 2v2M11 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 11h2M20 11h2M4.22 17.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                  <circle cx="12" cy="12" r="4" />
                </svg>
                <strong>Especialidad</strong>
              </button>
              <button type="button" class="choice-card" data-criterion="insurance" data-surgeries-only hidden role="listitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M3 7h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" />
                  <path d="M3 7l2.5-3h13L21 7" />
                  <path d="M12 11v6M9 14h6" />
                </svg>
                <strong>Obra social</strong>
              </button>
            </div>
          </div>
        </div>

        <!-- VISTA 2: criterio -->
        <div class="results" id="view-criterion" hidden>
          <button type="button" class="back-link" id="back-to-hub">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            Buscar por
          </button>
          <div class="criterion-wrap">
            <h2 class="step-title" id="criterion-title">Fecha</h2>

            <div class="field" id="field-date" hidden>
              <label for="input-date">Fecha</label>
              <input id="input-date" type="date" value="2026-03-12" />
            </div>

            <div class="field" id="field-professional" hidden>
              <label for="input-professional">Doctor</label>
              <select id="input-professional">
                <option value="">Elegí un doctor…</option>
                <option value="12" selected>Dra. Ana Gómez</option>
                <option value="7">Dr. Luis Pérez</option>
                <option value="3">Dra. María Ruiz</option>
              </select>
            </div>

            <div class="field" id="field-patient" hidden>
              <label for="input-patient">Paciente</label>
              <select id="input-patient">
                <option value="">Elegí un paciente…</option>
                <option value="44" selected>Juan López · 30111222</option>
                <option value="51">Carla Díaz · 28999000</option>
                <option value="18">Sofía Méndez · 40555666</option>
              </select>
            </div>

            <div class="field" id="field-specialty" hidden>
              <label for="input-specialty">Especialidad</label>
              <select id="input-specialty">
                <option value="">Elegí una especialidad…</option>
                <option value="2" selected>Cardiología</option>
                <option value="1">Clínica Médica</option>
                <option value="5">Dermatología</option>
                <option value="4">Traumatología</option>
              </select>
            </div>

            <div class="field" id="field-insurance" hidden>
              <label for="input-insurance">Obra social</label>
              <select id="input-insurance">
                <option value="">Elegí una obra social…</option>
                <option value="particular">Particular</option>
                <option value="1" selected>OSDE</option>
                <option value="2">Swiss Medical</option>
              </select>
            </div>

            <button type="button" class="btn btn-block" id="btn-search-criterion">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
              </svg>
              Buscar
            </button>
            <p class="hint">Ese valor queda fijo. Después podés filtrar por el resto.</p>
          </div>
        </div>

        <!-- VISTA 3: resultados -->
        <div class="results" id="view-results" hidden>
          <form class="toolbar" id="results-toolbar" onsubmit="return false;">
            <div class="field" id="results-primary-field">
              <label for="results-primary" id="results-primary-label">Fecha</label>
              <input id="results-primary" type="date" value="2026-03-12" readonly />
            </div>
            <button type="button" class="btn btn-outline" id="btn-filters">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M3 5h18M6 12h12M10 19h4" />
              </svg>
              Filtros
            </button>
            <button type="button" class="btn btn-danger" id="btn-clear">
              Limpiar búsqueda
            </button>
          </form>

          <div class="booking-list" id="booking-list"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="filters-modal" role="dialog" aria-modal="true" aria-labelledby="filters-title">
    <div class="modal">
      <h2 id="filters-title">Filtros</h2>
      <p class="hint" style="text-align:left;max-width:none" id="filters-hint">
        El criterio inicial queda fijo. Acá filtrás por el resto.
      </p>
      <div class="modal-grid" id="filters-fields"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="btn-filters-back">Volver</button>
        <button type="button" class="btn" id="btn-filters-apply">Aplicar</button>
      </div>
    </div>
  </div>

  <div class="proto-bar" aria-label="Controles del prototipo">
    <strong>Prototipo</strong>
    <div class="seg" role="group" aria-label="Dominio">
      <button type="button" class="is-on" data-domain="appointments">Turnos</button>
      <button type="button" data-domain="surgeries">Cirugías</button>
    </div>
    <div class="seg" role="group" aria-label="Rol">
      <button type="button" class="is-on" data-role="admin">Admin</button>
      <button type="button" data-role="professional">Profesional</button>
    </div>
    <div class="seg" role="group" aria-label="Vista rápida">
      <button type="button" class="is-on" data-jump="hub">Hub</button>
      <button type="button" data-jump="criterion">Criterio</button>
      <button type="button" data-jump="results">Resultados</button>
    </div>
  </div>

  <script>
    const state = {
      domain: "appointments", // appointments | surgeries
      role: "admin", // admin | professional
      view: "hub", // hub | criterion | results
      criterion: "date",
    };

    const labels = {
      date: "Fecha",
      professional: "Doctor",
      patient: "Paciente",
      specialty: "Especialidad",
      insurance: "Obra social",
    };

    const sampleValues = {
      date: { inputType: "date", inputValue: "2026-03-12" },
      professional: { inputType: "text", inputValue: "Dra. Ana Gómez" },
      patient: { inputType: "text", inputValue: "Juan López · 30111222" },
      specialty: { inputType: "text", inputValue: "Cardiología" },
      insurance: { inputType: "text", inputValue: "OSDE" },
    };

    const appointmentRows = `
      <article class="booking-card">
        <strong>Juan López</strong>
        <div class="booking-meta"><span class="booking-time">12/03/2026 · 09:00–09:20</span> · Dra. Ana Gómez · Cardiología</div>
      </article>
      <article class="booking-card">
        <strong>Carla Díaz</strong>
        <div class="booking-meta"><span class="booking-time">12/03/2026 · 09:40–10:00</span> · Dra. Ana Gómez · Cardiología</div>
      </article>
      <article class="booking-card">
        <strong>Sofía Méndez</strong>
        <div class="booking-meta"><span class="booking-time">12/03/2026 · 11:00–11:20</span> · Dr. Luis Pérez · Clínica Médica</div>
      </article>`;

    const surgeryRows = `
      <article class="booking-card">
        <strong>Juan López</strong>
        <div class="booking-meta"><span class="booking-time">12/03/2026 · 08:00–10:00</span> · Dra. Ana Gómez · OSDE</div>
      </article>
      <article class="booking-card">
        <strong>Carla Díaz</strong>
        <div class="booking-meta"><span class="booking-time">12/03/2026 · 11:00–12:30</span> · Dr. Luis Pérez · Particular</div>
      </article>`;

    const el = {
      hub: document.getElementById("view-hub"),
      criterion: document.getElementById("view-criterion"),
      results: document.getElementById("view-results"),
      grid: document.getElementById("choice-grid"),
      pageTitle: document.getElementById("page-title"),
      pageDesc: document.getElementById("page-desc"),
      criterionTitle: document.getElementById("criterion-title"),
      primaryLabel: document.getElementById("results-primary-label"),
      primaryInput: document.getElementById("results-primary"),
      bookingList: document.getElementById("booking-list"),
      filtersFields: document.getElementById("filters-fields"),
      filtersHint: document.getElementById("filters-hint"),
      filtersModal: document.getElementById("filters-modal"),
    };

    function domainCriteria() {
      if (state.domain === "surgeries") {
        return ["date", "professional", "patient", "insurance"];
      }
      return ["date", "professional", "patient", "specialty"];
    }

    function visibleCriteria() {
      return domainCriteria().filter((key) => !(state.role === "professional" && key === "professional"));
    }

    function syncChrome() {
      const isAppointments = state.domain === "appointments";
      el.pageTitle.textContent = isAppointments ? "Historial de turnos" : "Historial de cirugías";
      el.pageDesc.textContent = isAppointments
        ? state.role === "admin"
          ? "Turnos cuyo horario de inicio ya pasó."
          : "Tus turnos cuyo horario de inicio ya pasó."
        : state.role === "admin"
          ? "Cirugías programadas que ya pasaron."
          : "Tus cirugías programadas que ya pasaron.";

      document.querySelectorAll("[data-appointments-only]").forEach((node) => {
        node.hidden = !isAppointments;
      });
      document.querySelectorAll("[data-surgeries-only]").forEach((node) => {
        node.hidden = isAppointments;
      });
      document.querySelectorAll("[data-admin-only]").forEach((node) => {
        node.hidden = state.role !== "admin";
      });

      const visible = visibleCriteria();
      el.grid.classList.toggle("is-three", visible.length === 3);

      if (!visible.includes(state.criterion)) {
        state.criterion = "date";
      }
    }

    function showView(view) {
      state.view = view;
      el.hub.hidden = view !== "hub";
      el.criterion.hidden = view !== "criterion";
      el.results.hidden = view !== "results";
      document.querySelectorAll("[data-jump]").forEach((btn) => {
        btn.classList.toggle("is-on", btn.dataset.jump === view);
      });
    }

    function showCriterionFields() {
      ["date", "professional", "patient", "specialty", "insurance"].forEach((key) => {
        document.getElementById(`field-${key}`).hidden = key !== state.criterion;
      });
      el.criterionTitle.textContent = labels[state.criterion];
    }

    function openCriterion(criterion) {
      if (!visibleCriteria().includes(criterion)) return;
      state.criterion = criterion;
      showCriterionFields();
      showView("criterion");
    }

    function filterFieldDefs() {
      const defs = [
        { key: "date", label: "Fecha", control: `<input type="date" />` },
        {
          key: "professional",
          label: "Doctor",
          control: `<select><option value="">Todos</option><option>Dra. Ana Gómez</option><option>Dr. Luis Pérez</option></select>`,
        },
        {
          key: "patient",
          label: "Paciente",
          control: `<select><option value="">Todos</option><option>Juan López</option><option>Carla Díaz</option></select>`,
        },
      ];

      if (state.domain === "appointments") {
        defs.push({
          key: "specialty",
          label: "Especialidad",
          control: `<select><option value="all">Todas</option><option>Cardiología</option><option>Clínica Médica</option></select>`,
        });
      } else {
        defs.push(
          {
            key: "specialty",
            label: "Especialidad",
            control: `<select><option value="">Todas</option><option>Cardiología</option><option>Clínica Médica</option></select>`,
          },
          {
            key: "insurance",
            label: "Obra social",
            control: `<select><option value="">Todas</option><option value="particular">Particular</option><option>OSDE</option></select>`,
          },
        );
      }

      return defs.filter((item) => {
        if (item.key === state.criterion) return false;
        if (state.role === "professional" && item.key === "professional") return false;
        if (state.domain === "appointments" && item.key === "insurance") return false;
        return true;
      });
    }

    function buildFiltersFields() {
      el.filtersFields.innerHTML = filterFieldDefs()
        .map(
          (item) => `
          <div class="field">
            <label>${item.label}</label>
            ${item.control}
          </div>`,
        )
        .join("");
      el.filtersHint.textContent = `Criterio fijo: ${labels[state.criterion]}. Acá filtrás por el resto.`;
    }

    function openResults() {
      const sample = sampleValues[state.criterion];
      el.primaryLabel.textContent = labels[state.criterion];
      el.primaryInput.type = sample.inputType;
      el.primaryInput.value = sample.inputValue;
      el.primaryInput.readOnly = true;
      el.bookingList.innerHTML = state.domain === "appointments" ? appointmentRows : surgeryRows;
      buildFiltersFields();
      showView("results");
    }

    function resetToHub() {
      showView("hub");
    }

    document.querySelectorAll(".choice-card").forEach((card) => {
      card.addEventListener("click", () => openCriterion(card.dataset.criterion));
    });

    document.getElementById("back-to-hub").addEventListener("click", resetToHub);
    document.getElementById("btn-search-criterion").addEventListener("click", openResults);
    document.getElementById("btn-clear").addEventListener("click", resetToHub);

    document.getElementById("btn-filters").addEventListener("click", () => {
      buildFiltersFields();
      el.filtersModal.classList.add("is-open");
    });
    document.getElementById("btn-filters-back").addEventListener("click", () => {
      el.filtersModal.classList.remove("is-open");
    });
    document.getElementById("btn-filters-apply").addEventListener("click", () => {
      el.filtersModal.classList.remove("is-open");
    });
    el.filtersModal.addEventListener("click", (event) => {
      if (event.target === el.filtersModal) el.filtersModal.classList.remove("is-open");
    });

    document.querySelectorAll("[data-domain]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.domain = btn.dataset.domain;
        document.querySelectorAll("[data-domain]").forEach((b) => b.classList.toggle("is-on", b === btn));
        if (state.domain === "appointments" && state.criterion === "insurance") state.criterion = "specialty";
        if (state.domain === "surgeries" && state.criterion === "specialty") state.criterion = "insurance";
        syncChrome();
        resetToHub();
      });
    });

    document.querySelectorAll("[data-role]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.role = btn.dataset.role;
        document.querySelectorAll("[data-role]").forEach((b) => b.classList.toggle("is-on", b === btn));
        syncChrome();
        if (state.view === "criterion") showCriterionFields();
        if (state.view === "results") openResults();
        if (state.view === "hub") showView("hub");
      });
    });

    document.querySelectorAll("[data-jump]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const jump = btn.dataset.jump;
        if (jump === "hub") resetToHub();
        if (jump === "criterion") {
          showCriterionFields();
          showView("criterion");
        }
        if (jump === "results") openResults();
      });
    });

    syncChrome();
    showView("hub");
  </script>
</body>
</html>
