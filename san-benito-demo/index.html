<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sanatorio integral San Benito — Demos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter+Tight:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="demo/css/demo.css" />

  <div class="app-shell">

              <p class="hint" style="margin-top:0.35rem">Cada demo arranca en su propio index.</p>

              <div class="welcome-actions" style="flex-direction:column;align-items:stretch;margin-top:var(--space-md)">
                <a class="btn" href="demo/estable/">Estable</a>
                <a class="btn btn-outline" href="demo/pruebas/">Pruebas</a>

            </div>
